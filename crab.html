  <style>
    body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
    }

    #progress-wrapper {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      z-index: 1000;
    }

    #loading-text {
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 15px;
      color: rgb(177, 206, 177);;
      /* Change to black if your background is light */
      margin-bottom: 36px;
    }

    #progress-container {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 10px;
      background: #eee;
      border-radius: 5px;
      z-index: 1000;
      /* Ensure it stays above the A-Frame canvas */
    }

    #progress-bar {
      height: 100%;
      background: hsl(102, 21%, 82%);
      width: 0%;
      border-radius: 5px;
    }

    p {
      position: fixed;
      /* Now the <p> element is part of the stacking context */
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 10px;
      background: #eee;
      border-radius: 5px;
      z-index: 1000;
      /* This makes the paragraph appear on top of box1 */
    }
  </style>
</head>
